[versions]
shadow = "9.6.1"
spotless = "8.10.2"
jvmdowngrader = "2.0.1"
lombok = "1.18.48"
junit = "6.1.3"
jackson = "3.2.2"
json-schema-validator = "3.0.7"
forms-rt = "262.10315.174"
flatlaf = "3.7.2"
launchwrapper = "1.12"
modlauncher = "2.1.5"
log4j-api = "2.26.1"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
forms-rt = { module = "com.jetbrains.intellij.java:java-gui-forms-rt", version.ref = "forms-rt" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
launchwrapper = { module = "net.minecraft:launchwrapper", version.ref = "launchwrapper" }
modlauncher = { module = "cpw.mods:modlauncher", version.ref = "modlauncher" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j-api" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
jvmdowngrader = { id = "xyz.wagyourtail.jvmdowngrader", version.ref = "jvmdowngrader" }