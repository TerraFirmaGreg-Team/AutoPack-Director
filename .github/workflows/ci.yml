name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x gradlew
          fi
          ./gradlew --no-daemon test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/AutoPack-Director-*.jar
