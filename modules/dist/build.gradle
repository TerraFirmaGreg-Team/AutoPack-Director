plugins {
    id 'java'
    alias(libs.plugins.shadow)
    alias(libs.plugins.jvmdowngrader)
}

dependencies {
    implementation project(":cli")
    implementation project(":modlauncher")
    implementation project(":launchwrapper")
}

jvmdg {
    downgradeTo = JavaVersion.VERSION_1_8
}

def launchManifestAttributes = [
        "Main-Class"            : "${rootProject.property('namespace')}.cli.Cli",
        "TweakClass"            : "${rootProject.property('namespace')}.launchwrapper.Tweaker",
        "TweakOrder"            : Integer.MIN_VALUE,
        "Specification-Title"   : rootProject.property('name'),
        "Specification-Vendor"  : rootProject.property('vendor'),
        "Specification-Version" : 1,
        "Implementation-Title"  : rootProject.property('name'),
        "Implementation-Vendor" : rootProject.property('vendor'),
        "Implementation-Version": "${project.version}"
]

jar {
    manifest {
        attributes(launchManifestAttributes)
    }
}

shadowJar {
    archiveBaseName = rootProject.property('name')
    archiveClassifier.set('shadow')
    enableAutoRelocation = false
    mergeServiceFiles()
    exclude('META-INF/versions/**')
    exclude('META-INF/*.SF')
    exclude('META-INF/*.DSA')
    exclude('META-INF/*.RSA')

    relocate('tools.jackson', "${rootProject.property('namespace')}.shadow.jackson")
    relocate('com.fasterxml.jackson', "${rootProject.property('namespace')}.shadow.jackson")
    relocate('com.networknt', "${rootProject.property('namespace')}.shadow.networknt")
    relocate('com.ethlo.time', "${rootProject.property('namespace')}.shadow.ethlo.time")
    relocate('org.slf4j', "${rootProject.property('namespace')}.shadow.slf4j")
    relocate('org.snakeyaml', "${rootProject.property('namespace')}.shadow.snakeyaml")
}

tasks.named('downgradeJar') {
    dependsOn shadowJar
    archiveBaseName = rootProject.property('name')
    archiveClassifier.set('downgraded')
    destinationDirectory.set(layout.buildDirectory.dir('jvmdg'))
}

tasks.register('cleanDowngradedJar', Jar) {
    dependsOn tasks.named('downgradeJar')
    from zipTree(tasks.named('downgradeJar').flatMap { it.archiveFile })
    exclude 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**'
    destinationDirectory = layout.buildDirectory.dir('jvmdg')
    archiveBaseName = rootProject.property('name')
    archiveClassifier.set('clean')
    manifest {
        attributes(launchManifestAttributes)
    }
}

tasks.named('shadeDowngradedApi') {
    dependsOn('cleanDowngradedJar')
    inputFile.set(tasks.named('cleanDowngradedJar').flatMap { it.archiveFile })
    archiveBaseName = rootProject.property('name')
    archiveClassifier.set('')
    archiveFileName.set(providers.provider {
        "AutoPack-Director-${archiveVersion.get()}.jar"
    })
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
}

build {
    dependsOn(shadeDowngradedApi)
}
